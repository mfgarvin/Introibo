plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Build number derived from git commit count. Auto-increments with every
// commit; semver (versionName) is bumped by tool/release.sh in pubspec.yaml.
def gitBuildNumber = {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = stdout
            ignoreExitValue = true
        }
        def s = stdout.toString().trim()
        return s.isInteger() ? s.toInteger() : null
    } catch (Exception e) {
        return null
    }
}()

// The pubspec build number (`version: x.y.z+N`) is the committed *floor*.
// tool/release.sh keeps it in step with the commit count at each release, so a
// rewritten history (squash-merge, rebase) can never hand Play a versionCode
// lower than the last release. Play rejects any upload at or below a code it
// has already seen, and that rejection is permanent for that code.
def pubspecBuildNumber = flutter.versionCode.toString().isInteger()
        ? flutter.versionCode.toString().toInteger()
        : 1

// A debug build may fall back to the pubspec floor, but a release must never
// ship a silently-wrong (lower) build number — fail loudly instead.
def isReleaseBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
if (gitBuildNumber == null && isReleaseBuild) {
    throw new GradleException(
            "Cannot derive a build number: 'git rev-list --count HEAD' failed. " +
            "Release builds require a full (non-shallow) git checkout so the " +
            "versionCode keeps increasing. Falling back to the pubspec build " +
            "number ${pubspecBuildNumber} would be rejected by Play.")
}

def resolvedVersionCode = gitBuildNumber == null
        ? pubspecBuildNumber
        : Math.max(gitBuildNumber, pubspecBuildNumber)

android {
    namespace = "com.example.parishfinder"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.parishfinder"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // minSdk = flutter.minSdkVersion
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 35
        // minSdkVersion 21
        // targetSdkVersion 35
        // targetSdk = flutter.targetSdkVersion
        versionCode = resolvedVersionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
