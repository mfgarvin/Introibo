plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Build number derived from git commit count. Auto-increments with every
// commit; semver (versionName) is bumped by tool/release.sh in pubspec.yaml.
def gitBuildNumber = {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = stdout
            ignoreExitValue = true
        }
        def s = stdout.toString().trim()
        return s.isInteger() ? s.toInteger() : null
    } catch (Exception e) {
        return null
    }
}()

// The pubspec build number (`version: x.y.z+N`) is the committed *floor*.
// tool/release.sh keeps it in step with the commit count at each release, so a
// rewritten history (squash-merge, rebase) can never hand Play a versionCode
// lower than the last release. Play rejects any upload at or below a code it
// has already seen, and that rejection is permanent for that code.
def pubspecBuildNumber = flutter.versionCode.toString().isInteger()
        ? flutter.versionCode.toString().toInteger()
        : 1

// A debug build may fall back to the pubspec floor, but a release must never
// ship a silently-wrong (lower) build number — fail loudly instead.
def isReleaseBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
if (gitBuildNumber == null && isReleaseBuild) {
    throw new GradleException(
            "Cannot derive a build number: 'git rev-list --count HEAD' failed. " +
            "Release builds require a full (non-shallow) git checkout so the " +
            "versionCode keeps increasing. Falling back to the pubspec build " +
            "number ${pubspecBuildNumber} would be rejected by Play.")
}

def resolvedVersionCode = gitBuildNumber == null
        ? pubspecBuildNumber
        : Math.max(gitBuildNumber, pubspecBuildNumber)

// Release signing credentials live in android/key.properties, which is
// gitignored — never commit the keystore or its passwords. See
// docs/play-release.md for how to generate the keystore and populate this file.
// When the file is absent (CI without secrets, a fresh clone, or anyone just
// running debug builds) release signing is simply left unconfigured; the
// `release` buildType below turns that into a loud failure rather than a
// silently debug-signed AAB, which Play rejects on upload.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "app.parishfinder"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // Reverse-DNS of parishfinder.app. This is permanent once the first
        // build is uploaded to Play — it can never be changed for this listing.
        applicationId = "app.parishfinder"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        // Play requires API 36 for new app submissions from 2026-08-31.
        // Android 16 makes edge-to-edge non-optional — verify insets on device.
        targetSdk = flutter.targetSdkVersion
        versionCode = resolvedVersionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig = signingConfigs.release
            } else if (isReleaseBuild) {
                // Debug-signed artifacts are rejected by Play, and a debug key
                // that reached production could never be rotated. Fail here
                // instead of producing an upload that looks fine until it isn't.
                throw new GradleException(
                        "Release build requires android/key.properties with the " +
                        "upload keystore details (storeFile, storePassword, " +
                        "keyAlias, keyPassword). See docs/play-release.md.")
            }

            // R8 shrinking + resource stripping. Keeps the AAB small and strips
            // unreachable code; Flutter ships the keep rules its engine needs.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro")
        }
    }
}

flutter {
    source = "../.."
}
